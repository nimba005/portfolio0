# Cloudflare Worker serving the portfolio. Secrets (DATABASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD_HASH, TOKEN_SECRET,
# IP_SALT) are set in the Cloudflare dashboard, never in this file.
name = "ericnimba"
main = "worker/index.js"
compatibility_date = "2025-09-01"
# node-postgres needs Node compatibility for its TCP socket support.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# Unknown paths such as /admin load the React app.
not_found_handling = "single-page-application"
# Everything except the API is served straight from dist/ without running the Worker.
run_worker_first = ["/api/*"]
