# Cloudflare Pages project. Secrets (DATABASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD_HASH, TOKEN_SECRET, IP_SALT)
# are set in the Cloudflare dashboard, never in this file.
name = "ericnimba"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
# node-postgres needs Node compatibility for its TCP socket support.
compatibility_flags = ["nodejs_compat"]
